name: Build

# Runs for each commit/PR, but not tag push
on:
  push:
    branches:
      - "**"
  pull_request:

env:
  CARGO_TERM_COLOR: always

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref && github.ref || github.run_id }}
  cancel-in-progress: true

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        platform: [windows-latest, ubuntu-latest]

    runs-on: ${{ matrix.platform }}

    steps:
      - uses: actions/checkout@v4
      - name: Install Linux Dependencies
        if: ${{ startsWith(matrix.platform, 'ubuntu') }}
        run: sudo apt-get update && sudo apt-get install -y libdbus-1-dev
      - name: Setup Rust toolchain and cache
        uses: actions-rust-lang/setup-rust-toolchain@v1.9.0
      # - name: cargo fmt
      #   run: cargo fmt --all -- --check
      - name: Build
        run: cargo build --verbose --features portable
      - uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.platform }}-${{ github.sha }}
          path: |
            target/debug/iron-heart
            target/debug/iron-heart.exe
          if-no-files-found: error
      - name: Run Clippy
        run: cargo clippy --all-targets --all-features
      - name: Run Unit Tests
        run: cargo test --all-targets --all-features
      - name: Run Integration Tests
        run: cargo test --all-targets --all-features -- --ignored --show-output --test-threads=1
